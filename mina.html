<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mina 🐶💕</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: white;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    .volver {
        position: fixed;
        top: 25px;
        left: 50%;
        transform: translateX(-50%);

        padding: 11px 22px;

        background: linear-gradient(135deg, #ff8fb3, #ffb6c9);
        color: white;

        text-decoration: none;
        font-size: 16px;
        font-weight: bold;

        border-radius: 25px;

        box-shadow: 0 5px 15px rgba(255, 105, 150, 0.25);

        transition: 0.25s;

        z-index: 100;
    }

    .volver:hover {
        transform: translateX(-50%) scale(1.08);
        box-shadow: 0 8px 22px rgba(255, 105, 150, 0.4);
    }
</style>
</head>

<body>

<a href="index.html" class="volver">
    🌸 Volver a las flores
</a>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;
let time = 0;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


// --------------------------------------------------
// UTILIDADES
// --------------------------------------------------

function ellipse(x, y, rx, ry, fill, stroke = "#111", line = 6) {

    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);

    if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
    }

    if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = line;
        ctx.stroke();
    }
}


function roundRect(x, y, w, h, r, fill, stroke = "#111", line = 6) {

    ctx.beginPath();

    ctx.roundRect(x, y, w, h, r);

    if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
    }

    if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = line;
        ctx.stroke();
    }
}


function line(points, width = 6, color = "#111") {

    ctx.beginPath();

    ctx.moveTo(points[0][0], points[0][1]);

    for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i][0], points[i][1]);
    }

    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();
}


function heart(x, y, size, alpha = 1) {

    ctx.save();

    ctx.globalAlpha = alpha;

    ctx.beginPath();

    ctx.moveTo(x, y + size * 0.3);

    ctx.bezierCurveTo(
        x - size * 0.8,
        y - size * 0.2,
        x - size * 0.5,
        y - size * 0.8,
        x,
        y - size * 0.3
    );

    ctx.bezierCurveTo(
        x + size * 0.5,
        y - size * 0.8,
        x + size * 0.8,
        y - size * 0.2,
        x,
        y + size * 0.3
    );

    ctx.fillStyle = "#ff9fbd";
    ctx.fill();

    ctx.restore();
}


// --------------------------------------------------
// PUG
// --------------------------------------------------

function drawPug() {

    const cx = W / 2;

    // Tamaño adaptativo
    const scale = Math.min(W, H) / 900;

    ctx.save();

    ctx.translate(cx, H * 0.47);
    ctx.scale(scale, scale);

    const bob = Math.sin(time * 0.0025) * 2;

    ctx.translate(0, bob);


    // ==============================================
    // CUERPO
    // ==============================================

    // Cuello / cuerpo detrás de la cabeza
    ellipse(
        0,
        270,
        175,
        120,
        "#e8d8bd",
        "#111",
        7
    );


    // ==============================================
    // OREJA IZQUIERDA
    // ==============================================

    ctx.beginPath();

    ctx.moveTo(-180, -170);

    ctx.bezierCurveTo(
        -245, -200,
        -260, -135,
        -245, -55
    );

    ctx.bezierCurveTo(
        -240, 5,
        -200, 35,
        -165, 5
    );

    ctx.bezierCurveTo(
        -145, -35,
        -145, -125,
        -125, -175
    );

    ctx.closePath();

    ctx.fillStyle = "#4d4b4d";
    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 8;
    ctx.stroke();


    // ==============================================
    // OREJA DERECHA
    // ==============================================

    ctx.beginPath();

    ctx.moveTo(165, -165);

    ctx.bezierCurveTo(
        225, -175,
        260, -110,
        245, -55
    );

    ctx.bezierCurveTo(
        235, -15,
        200, 20,
        165, 10
    );

    ctx.bezierCurveTo(
        145, -20,
        150, -110,
        130, -160
    );

    ctx.closePath();

    ctx.fillStyle = "#4d4b4d";
    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 8;
    ctx.stroke();


    // ==============================================
    // CABEZA GRANDE DE PUG
    // ==============================================

    const headGradient = ctx.createRadialGradient(
        -45,
        -100,
        30,
        0,
        0,
        270
    );

    headGradient.addColorStop(0, "#f1e4cb");
    headGradient.addColorStop(0.75, "#e4d3b6");
    headGradient.addColorStop(1, "#d5c19e");


    ctx.beginPath();

    ctx.moveTo(-165, -175);

    ctx.bezierCurveTo(
        -135, -245,
        -45, -265,
        0, -250
    );

    ctx.bezierCurveTo(
        65, -270,
        145, -235,
        170, -170
    );

    ctx.bezierCurveTo(
        195, -110,
        190, -20,
        175, 55
    );

    ctx.bezierCurveTo(
        165, 145,
        105, 205,
        0, 210
    );

    ctx.bezierCurveTo(
        -105, 205,
        -165, 145,
        -175, 55
    );

    ctx.bezierCurveTo(
        -190, -25,
        -190, -115,
        -165, -175
    );

    ctx.closePath();

    ctx.fillStyle = headGradient;
    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 8;
    ctx.stroke();


    // ==============================================
    // ARRUGAS DE LA FRENTE
    // ==============================================

    line([
        [-65, -205],
        [-35, -220],
        [-5, -218]
    ], 7);

    line([
        [8, -220],
        [35, -222],
        [62, -208]
    ], 7);

    line([
        [-92, -180],
        [-65, -190]
    ], 6);

    line([
        [65, -190],
        [92, -180]
    ], 6);


    // ==============================================
    // MÁSCARA OSCURA
    // ==============================================

    ctx.beginPath();

    ctx.moveTo(-145, -65);

    ctx.bezierCurveTo(
        -125, -125,
        -75, -145,
        -30, -105
    );

    ctx.bezierCurveTo(
        -10, -125,
        10, -125,
        30, -105
    );

    ctx.bezierCurveTo(
        75, -145,
        125, -125,
        145, -65
    );

    ctx.bezierCurveTo(
        160, 10,
        120, 90,
        55, 100
    );

    ctx.bezierCurveTo(
        20, 110,
        -20, 110,
        -55, 100
    );

    ctx.bezierCurveTo(
        -120, 90,
        -160, 10,
        -145, -65
    );

    ctx.closePath();

    ctx.fillStyle = "#575557";
    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 7;
    ctx.stroke();


    // ==============================================
    // OJOS GRANDES DE PUG
    // ==============================================

    // Ojo izquierdo
    ellipse(
        -83,
        -72,
        42,
        48,
        "#080808",
        "#111",
        5
    );

    // Ojo derecho
    ellipse(
        83,
        -72,
        42,
        48,
        "#080808",
        "#111",
        5
    );


    // Brillos
    ellipse(-96, -88, 11, 13, "white", null, 0);
    ellipse(70, -88, 11, 13, "white", null, 0);

    ellipse(-72, -52, 5, 6, "#dddddd", null, 0);
    ellipse(94, -52, 5, 6, "#dddddd", null, 0);


    // ==============================================
    // CEJAS
    // ==============================================

    line([
        [-115, -125],
        [-85, -138],
        [-55, -132]
    ], 8);

    line([
        [55, -132],
        [85, -138],
        [115, -125]
    ], 8);


    // ==============================================
    // ARRUGAS ALREDEDOR DEL HOCICO
    // ==============================================

    line([
        [-145, -20],
        [-115, -35],
        [-85, -30],
        [-55, -10]
    ], 7);

    line([
        [145, -20],
        [115, -35],
        [85, -30],
        [55, -10]
    ], 7);


    // ==============================================
    // HOCICO / MEJILLAS
    // ==============================================

    ellipse(
        -58,
        30,
        68,
        58,
        "#656365",
        "#111",
        6
    );

    ellipse(
        58,
        30,
        68,
        58,
        "#656365",
        "#111",
        6
    );


    // ==============================================
    // NARIZ NEGRA
    // ==============================================

    ctx.beginPath();

    ctx.moveTo(-52, -15);

    ctx.bezierCurveTo(
        -35, -38,
        35, -38,
        52, -15
    );

    ctx.bezierCurveTo(
        48, 12,
        20, 28,
        0, 32
    );

    ctx.bezierCurveTo(
        -20, 28,
        -48, 12,
        -52, -15
    );

    ctx.closePath();

    ctx.fillStyle = "#050505";
    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 6;
    ctx.stroke();


    // brillo de nariz
    ellipse(
        -25,
        -12,
        10,
        7,
        "#555",
        null,
        0
    );


    // ==============================================
    // LÍNEA DEL HOCICO
    // ==============================================

    line([
        [0, 27],
        [0, 78]
    ], 7);


    // ==============================================
    // BOCA
    // ==============================================

    ctx.beginPath();

    ctx.moveTo(-75, 73);

    ctx.bezierCurveTo(
        -55, 115,
        -20, 125,
        0, 105
    );

    ctx.bezierCurveTo(
        20, 125,
        55, 115,
        75, 73
    );

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.stroke();


    // interior de la boca
    ctx.beginPath();

    ctx.moveTo(-55, 80);

    ctx.bezierCurveTo(
        -40, 145,
        40, 145,
        55, 80
    );

    ctx.fillStyle = "#242224";
    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 6;
    ctx.stroke();


    // ==============================================
    // LENGUA
    // ==============================================

    ctx.beginPath();

    ctx.moveTo(-25, 105);

    ctx.bezierCurveTo(
        -25, 150,
        -15, 165,
        0, 166
    );

    ctx.bezierCurveTo(
        15, 165,
        25, 150,
        25, 105
    );

    ctx.closePath();

    const tongueGradient = ctx.createLinearGradient(
        0, 105,
        0, 165
    );

    tongueGradient.addColorStop(0, "#ff9baa");
    tongueGradient.addColorStop(1, "#ed7085");

    ctx.fillStyle = tongueGradient;
    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 6;
    ctx.stroke();


    // línea de la lengua
    line([
        [0, 120],
        [0, 153]
    ], 4, "#b95768");


    // ==============================================
    // PATITA IZQUIERDA
    // ==============================================

    ctx.beginPath();

    ctx.moveTo(-170, 170);

    ctx.bezierCurveTo(
        -205, 160,
        -220, 185,
        -218, 220
    );

    ctx.bezierCurveTo(
        -218, 250,
        -195, 265,
        -160, 260
    );

    ctx.bezierCurveTo(
        -125, 265,
        -105, 250,
        -110, 220
    );

    ctx.bezierCurveTo(
        -110, 190,
        -135, 170,
        -170, 170
    );

    ctx.closePath();

    ctx.fillStyle = "#ead9bd";
    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 7;
    ctx.stroke();


    // ==============================================
    // PATITA DERECHA
    // ==============================================

    ctx.beginPath();

    ctx.moveTo(170, 170);

    ctx.bezierCurveTo(
        205, 160,
        220, 185,
        218, 220
    );

    ctx.bezierCurveTo(
        218, 250,
        195, 265,
        160, 260
    );

    ctx.bezierCurveTo(
        125, 265,
        105, 250,
        110, 220
    );

    ctx.bezierCurveTo(
        110, 190,
        135, 170,
        170, 170
    );

    ctx.closePath();

    ctx.fillStyle = "#ead9bd";
    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 7;
    ctx.stroke();


    // ==============================================
    // DEDITOS
    // ==============================================

    line([
        [-185, 215],
        [-185, 240]
    ], 6);

    line([
        [-155, 212],
        [-155, 242]
    ], 6);

    line([
        [-130, 215],
        [-130, 238]
    ], 6);


    line([
        [185, 215],
        [185, 240]
    ], 6);

    line([
        [155, 212],
        [155, 242]
    ], 6);

    line([
        [130, 215],
        [130, 238]
    ], 6);


    // ==============================================
    // LÍNEA DEL SUELO
    // ==============================================

    line([
        [-260, 260],
        [260, 260]
    ], 8);


    // ==============================================
    // MOÑO ROSA
    // ==============================================

    // Solo un pequeño moño en la parte superior
    // para no tapar la cara del pug.

    ctx.save();

    ctx.translate(125, -205);
    ctx.rotate(0.12);

    // lado izquierdo
    ctx.beginPath();

    ctx.moveTo(0, 0);

    ctx.bezierCurveTo(
        -45, -30,
        -75, -15,
        -70, 20
    );

    ctx.bezierCurveTo(
        -65, 45,
        -25, 35,
        0, 15
    );

    ctx.closePath();

    ctx.fillStyle = "#ff9fbd";
    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 6;
    ctx.stroke();


    // lado derecho
    ctx.beginPath();

    ctx.moveTo(0, 0);

    ctx.bezierCurveTo(
        45, -30,
        75, -15,
        70, 20
    );

    ctx.bezierCurveTo(
        65, 45,
        25, 35,
        0, 15
    );

    ctx.closePath();

    ctx.fillStyle = "#ff9fbd";
    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 6;
    ctx.stroke();


    // centro
    ellipse(
        0,
        8,
        18,
        18,
        "#ff719f",
        "#111",
        5
    );

    ctx.restore();


    ctx.restore();
}


// --------------------------------------------------
// TEXTO
// --------------------------------------------------

function drawText() {

    const scale = Math.min(W, H) / 900;

    ctx.save();

    ctx.translate(W / 2, H * 0.82);

    ctx.scale(scale, scale);

    const gradient = ctx.createLinearGradient(
        -100,
        0,
        100,
        0
    );

    gradient.addColorStop(0, "#ff719f");
    gradient.addColorStop(0.5, "#ff9fbd");
    gradient.addColorStop(1, "#ff719f");

    ctx.font = "bold 72px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = gradient;

    ctx.shadowColor = "rgba(255, 105, 150, 0.25)";
    ctx.shadowBlur = 12;

    ctx.fillText("MINA", 0, 0);

    ctx.shadowBlur = 0;

    ctx.font = "20px Arial";

    ctx.fillStyle = "#777";

    ctx.fillText(
        "♡ una pequeña pug muy especial ♡",
        0,
        42
    );

    ctx.restore();
}


// --------------------------------------------------
// CORAZONES
// --------------------------------------------------

function drawHearts() {

    const s = Math.min(W, H) / 900;

    heart(
        W / 2 - 280 * s,
        H * 0.38,
        22 * s,
        0.75
    );

    heart(
        W / 2 + 285 * s,
        H * 0.43,
        18 * s,
        0.65
    );

    heart(
        W / 2 - 320 * s,
        H * 0.58,
        13 * s,
        0.5
    );

    heart(
        W / 2 + 325 * s,
        H * 0.59,
        14 * s,
        0.5
    );
}


// --------------------------------------------------
// ANIMACIÓN
// --------------------------------------------------

function animate() {

    ctx.clearRect(0, 0, W, H);

    time += 16;

    drawHearts();
    drawPug();
    drawText();

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>

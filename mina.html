<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;
let time = 0;


// ==================================================
// RESIZE
// ==================================================

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


// ==================================================
// UTILIDADES
// ==================================================

function ellipse(
    x, y,
    rx, ry,
    fill,
    stroke = "#171515",
    line = 5,
    rotation = 0
) {

    ctx.save();

    ctx.translate(x, y);
    ctx.rotate(rotation);

    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);

    if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
    }

    if (stroke && line > 0) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = line;
        ctx.stroke();
    }

    ctx.restore();
}


function circle(
    x, y,
    r,
    fill,
    stroke = "#171515",
    line = 5
) {

    ellipse(x, y, r, r, fill, stroke, line);
}


function line(x1, y1, x2, y2, width = 5, color = "#171515") {

    ctx.beginPath();

    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);

    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";

    ctx.stroke();
}


function heart(x, y, size, alpha = 1) {

    ctx.save();

    ctx.globalAlpha = alpha;

    ctx.beginPath();

    ctx.moveTo(x, y + size * 0.3);

    ctx.bezierCurveTo(
        x - size * 0.8,
        y - size * 0.2,
        x - size * 0.5,
        y - size * 0.8,
        x,
        y - size * 0.3
    );

    ctx.bezierCurveTo(
        x + size * 0.5,
        y - size * 0.8,
        x + size * 0.8,
        y - size * 0.2,
        x,
        y + size * 0.3
    );

    ctx.fillStyle = "#ff9fbd";
    ctx.fill();

    ctx.restore();
}

// ==================================================
// TEXTO
// ==================================================

function drawText() {

    const scale = Math.min(W, H) / 900;

    ctx.save();

    ctx.translate(W / 2, H * 0.82);
    ctx.scale(scale, scale);

    const gradient = ctx.createLinearGradient(
        -100,
        0,
        100,
        0
    );

    gradient.addColorStop(0, "#ff719f");
    gradient.addColorStop(0.5, "#ff9fbd");
    gradient.addColorStop(1, "#ff719f");

    ctx.font = "bold 72px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = gradient;

    ctx.shadowColor = "rgba(255, 105, 150, 0.25)";
    ctx.shadowBlur = 12;

    ctx.fillText("MINA", 0, 0);

    ctx.shadowBlur = 0;

    ctx.font = "20px Arial";
    ctx.fillStyle = "#777";

    ctx.fillText(
        "♡ una pequeña pug muy especial ♡",
        0,
        42
    );

    ctx.restore();
}


// ==================================================
// CORAZONES
// ==================================================

function drawHearts() {

    const s = Math.min(W, H) / 900;

    heart(
        W / 2 - 280 * s,
        H * 0.38,
        22 * s,
        0.75
    );

    heart(
        W / 2 + 285 * s,
        H * 0.43,
        18 * s,
        0.65
    );

    heart(
        W / 2 - 320 * s,
        H * 0.58,
        13 * s,
        0.5
    );

    heart(
        W / 2 + 325 * s,
        H * 0.59,
        14 * s,
        0.5
    );
}


// ==================================================
// ANIMACIÓN
// ==================================================

function animate() {

    ctx.clearRect(0, 0, W, H);

    time += 16;

    drawHearts();
    drawPug();
    drawText();

    requestAnimationFrame(animate);
}

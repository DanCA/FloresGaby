<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores 🌸</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: white;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

<a href="mina.html" class="boton-mina">
    🐶 Conoce a Mina
</a>

<style>
    .boton-mina {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);

        padding: 14px 28px;

        background: linear-gradient(
            135deg,
            #ff8fb3,
            #ffb6c9
        );

        color: white;
        text-decoration: none;

        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: bold;

        border-radius: 30px;

        box-shadow:
            0 5px 15px rgba(255, 105, 150, 0.3);

        transition: 0.25s;
        z-index: 100;
    }

    .boton-mina:hover {
        transform: translateX(-50%) scale(1.08);

        box-shadow:
            0 8px 22px rgba(255, 105, 150, 0.45);
    }
</style>
    
<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;
let tiempo = 0;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


// --------------------------------------------------
// Utilidades
// --------------------------------------------------

function rotarPunto(x, y, angulo) {
    return {
        x: x * Math.cos(angulo) - y * Math.sin(angulo),
        y: x * Math.sin(angulo) + y * Math.cos(angulo)
    };
}


// --------------------------------------------------
// TALLO
// --------------------------------------------------

function dibujarTallo(x, y, altura, curvatura, progreso) {

    const h = altura * progreso;

    if (h <= 0) return;

    ctx.save();

    ctx.beginPath();
    ctx.moveTo(x, y);

    ctx.bezierCurveTo(
        x + curvatura,
        y - h * 0.30,
        x - curvatura,
        y - h * 0.70,
        x,
        y - h
    );

    const gradiente = ctx.createLinearGradient(x, y, x, y - h);

    gradiente.addColorStop(0, "#176b35");
    gradiente.addColorStop(0.5, "#39a852");
    gradiente.addColorStop(1, "#75c96b");

    ctx.strokeStyle = gradiente;
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.stroke();

    ctx.restore();
}


// --------------------------------------------------
// HOJA
// --------------------------------------------------

function dibujarHoja(x, y, tamaño, angulo, progreso) {

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angulo);

    ctx.scale(progreso, progreso);

    ctx.beginPath();

    ctx.moveTo(0, 0);

    ctx.bezierCurveTo(
        tamaño * 0.25,
        -tamaño * 0.45,
        tamaño * 0.8,
        -tamaño * 0.55,
        tamaño,
        0
    );

    ctx.bezierCurveTo(
        tamaño * 0.65,
        tamaño * 0.35,
        tamaño * 0.25,
        tamaño * 0.25,
        0,
        0
    );

    const gradiente = ctx.createLinearGradient(0, 0, tamaño, 0);

    gradiente.addColorStop(0, "#218c43");
    gradiente.addColorStop(0.5, "#51bd5d");
    gradiente.addColorStop(1, "#9add75");

    ctx.fillStyle = gradiente;
    ctx.fill();

    // Nervadura
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(tamaño * 0.85, 0);

    ctx.strokeStyle = "rgba(20,100,40,0.5)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
}


// --------------------------------------------------
// PÉTALO
// --------------------------------------------------

function dibujarPetalo(
    x,
    y,
    tamaño,
    angulo,
    color1,
    color2,
    progreso
) {

    ctx.save();

    ctx.translate(x, y);
    ctx.rotate(angulo);

    ctx.scale(progreso, progreso);

    ctx.beginPath();

    ctx.moveTo(0, 0);

    ctx.bezierCurveTo(
        tamaño * 0.15,
        -tamaño * 0.45,
        tamaño * 0.75,
        -tamaño * 0.75,
        0,
        -tamaño
    );

    ctx.bezierCurveTo(
        -tamaño * 0.75,
        -tamaño * 0.75,
        -tamaño * 0.15,
        -tamaño * 0.45,
        0,
        0
    );

    const gradiente = ctx.createLinearGradient(
        0,
        0,
        0,
        -tamaño
    );

    gradiente.addColorStop(0, color1);
    gradiente.addColorStop(0.6, color2);
    gradiente.addColorStop(1, "#ffffff");

    ctx.fillStyle = gradiente;
    ctx.fill();

    ctx.strokeStyle = "rgba(100,60,80,0.18)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
}


// --------------------------------------------------
// CENTRO DE FLOR
// --------------------------------------------------

function dibujarCentro(x, y, tamaño, progreso) {

    ctx.save();

    ctx.globalAlpha = progreso;

    // Halo
    const halo = ctx.createRadialGradient(
        x,
        y,
        0,
        x,
        y,
        tamaño * 1.4
    );

    halo.addColorStop(0, "rgba(255,220,60,0.35)");
    halo.addColorStop(1, "rgba(255,220,60,0)");

    ctx.fillStyle = halo;

    ctx.beginPath();
    ctx.arc(x, y, tamaño * 1.4, 0, Math.PI * 2);
    ctx.fill();


    // Semillas
    for (let i = 0; i < 45; i++) {

        const a = i * 2.39996;
        const r = tamaño * Math.sqrt(i / 45);

        const px = x + Math.cos(a) * r;
        const py = y + Math.sin(a) * r;

        ctx.beginPath();

        ctx.arc(
            px,
            py,
            Math.max(1.2, tamaño * 0.055),
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            i % 3 === 0
                ? "#d88916"
                : "#8d5a18";

        ctx.fill();
    }

    ctx.restore();
}


// --------------------------------------------------
// FLOR
// --------------------------------------------------

function dibujarFlor(
    x,
    y,
    tamaño,
    colores,
    petalos,
    progreso
) {

    if (progreso <= 0) return;

    // Sombra debajo de la flor
    ctx.save();

    ctx.globalAlpha = 0.12 * progreso;
    ctx.beginPath();

    ctx.ellipse(
        x,
        y + tamaño * 0.12,
        tamaño * 0.75,
        tamaño * 0.18,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#777";
    ctx.fill();

    ctx.restore();


    // Pétalos exteriores
    for (let i = 0; i < petalos; i++) {

        const angulo =
            (Math.PI * 2 / petalos) * i;

        dibujarPetalo(
            x,
            y,
            tamaño,
            angulo,
            colores[0],
            colores[1],
            progreso
        );
    }


    // Pétalos interiores
    for (let i = 0; i < petalos; i++) {

        const angulo =
            (Math.PI * 2 / petalos) * i +
            Math.PI / petalos;

        dibujarPetalo(
            x,
            y,
            tamaño * 0.62,
            angulo,
            colores[1],
            colores[2],
            progreso
        );
    }


    dibujarCentro(
        x,
        y,
        tamaño * 0.24,
        progreso
    );
}


// --------------------------------------------------
// FLORES
// --------------------------------------------------

const flores = [

    {
        x: 0.18,
        y: 0.78,
        tamaño: 48,
        altura: 250,
        color: ["#ff6b9d", "#ff9fbd", "#ffd1df"],
        petalos: 9,
        curva: 35
    },

    {
        x: 0.40,
        y: 0.72,
        tamaño: 70,
        altura: 330,
        color: ["#9b6cff", "#c49aff", "#ead9ff"],
        petalos: 11,
        curva: -40
    },

    {
        x: 0.63,
        y: 0.76,
        tamaño: 58,
        altura: 280,
        color: ["#ff5964", "#ff858c", "#ffc5c8"],
        petalos: 10,
        curva: 35
    },

    {
        x: 0.82,
        y: 0.80,
        tamaño: 45,
        altura: 230,
        color: ["#ff9d28", "#ffc15c", "#ffe4a7"],
        petalos: 8,
        curva: -30
    },

    {
        x: 0.53,
        y: 0.91,
        tamaño: 38,
        altura: 180,
        color: ["#37a7e8", "#74c8f5", "#c5ecff"],
        petalos: 7,
        curva: 25
    }
];


// --------------------------------------------------
// ANIMACIÓN
// --------------------------------------------------

function animar() {

    ctx.clearRect(0, 0, W, H);

    // Fondo blanco
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);


    tiempo += 0.012;


    flores.forEach((flor, indice) => {

        const retraso = indice * 0.55;

        const crecimiento =
            Math.max(
                0,
                Math.min(
                    1,
                    (tiempo - retraso) * 0.55
                )
            );


        const x = W * flor.x;
        const y = H * flor.y;


        // Tallo
        dibujarTallo(
            x,
            y,
            flor.altura,
            flor.curva,
            crecimiento
        );


        // Hojas
        if (crecimiento > 0.25) {

            dibujarHoja(
                x,
                y - flor.altura * 0.35,
                flor.tamaño * 0.8,
                -0.7,
                Math.min(1, crecimiento * 2)
            );

            dibujarHoja(
                x,
                y - flor.altura * 0.60,
                flor.tamaño * 0.65,
                2.8,
                Math.min(1, crecimiento * 2)
            );
        }


        // Flor
        if (crecimiento > 0.55) {

            const florProgreso =
                Math.min(
                    1,
                    (crecimiento - 0.55) * 2.2
                );

            dibujarFlor(
                x,
                y - flor.altura,
                flor.tamaño,
                flor.color,
                flor.petalos,
                florProgreso
            );
        }

    });


    requestAnimationFrame(animar);
}


animar();

</script>

</body>
</html>
